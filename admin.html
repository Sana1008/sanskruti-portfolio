<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Editor</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="fixes.css"></head>
<body data-page="admin"><header class="site-header wrap"><a class="brand" href="index.html">SD<span>.</span></a><nav class="nav-links"><a href="index.html">Public site</a><a href="projects.html">Public projects</a></nav><button class="header-email owner-button" id="addProjectTop">+ Add project</button></header>
<main><section class="projects-hero wrap"><p class="eyebrow"><span class="eyebrow-line"></span> Private editor</p><h1>Manage <span>projects.</span></h1><p class="hero-lede">This page is not linked from the public portfolio. Changes are saved in this browser.</p></section><section class="projects-toolbar wrap"><span class="project-count" id="projectCount">Projects</span><div><button class="button button-primary small-button" id="addProjectButton">+ Add project</button><button class="text-button" id="exportProjects">Export project data ↗</button><button class="text-button" id="resetProjects">Reset local changes</button></div></section><section class="project-grid wrap" id="projectGrid"></section></main>
<dialog id="projectDialog" class="project-dialog"><form method="dialog" id="projectForm"><div class="dialog-head"><div><p class="eyebrow">Project editor</p><h2>Add a project</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="Close">×</button></div><label>Project title<input name="title" required placeholder="e.g. Reliable Job Queue"></label><label>Description<textarea name="description" required rows="3" placeholder="What did you build or investigate?"></textarea></label><div class="form-row"><label>Category<input name="category" placeholder="e.g. Backend systems"></label><label>Primary technology<input name="tech" placeholder="e.g. Go, PostgreSQL"></label></div><label>Tags <span class="label-hint">comma-separated</span><input name="tags" placeholder="reliability, databases, testing"></label><label>Project link <span class="label-hint">optional</span><input name="link" type="url" placeholder="https://github.com/yourname/project"></label><div class="dialog-actions"><button type="button" class="button button-ghost" id="cancelDialog">Cancel</button><button class="button button-primary" type="submit">Add project</button></div></form></dialog><script src="script.js"></script></body></html>
